<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Q CRM</title>
    <script>
      // Boot guard: apply persisted theme + language before first paint (no flash).
      (function () {
        try {
          var root = document.documentElement;
          var t = JSON.parse(localStorage.getItem("qcrm.theme") || "{}");
          var mode = t.mode || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          root.setAttribute("data-theme", dark ? "dark" : "light");

          var lang = localStorage.getItem("qcrm.locale");
          if (!lang) {
            var nav = (navigator.language || "en").toLowerCase().split("-")[0];
            lang = ["en", "tr", "de", "ar"].indexOf(nav) >= 0 ? nav : "en";
          }
          root.setAttribute("lang", lang);
          root.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
        } catch (e) {
          /* storage unavailable — fall back to markup defaults */
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
